<!doctype html><html lang="sk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>myLife · interné nástroje</title>
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:28px 16px;
  font-family:-apple-system,system-ui,'Segoe UI',sans-serif;color:#111;
  background:linear-gradient(155deg,#1A150E 0%,#12100B 55%,#0D0B08 100%);overflow:hidden;position:relative}
body::before,body::after{content:'';position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none}
body::before{width:420px;height:420px;left:-140px;top:-120px;
  background:radial-gradient(circle,rgba(253,225,175,.34),transparent 65%);
  animation:fl 11s ease-in-out infinite alternate}
body::after{width:460px;height:460px;right:-160px;bottom:-170px;
  background:radial-gradient(circle,rgba(43,107,74,.35),transparent 65%);
  animation:fl 13s ease-in-out infinite alternate-reverse}
@keyframes fl{from{transform:translate(0,0)}to{transform:translate(40px,26px)}}
.ring{position:fixed;border-radius:50%;border:1px solid rgba(253,225,175,.10);pointer-events:none}
.r1{width:560px;height:560px;left:-190px;bottom:-260px}
.r2{width:640px;height:640px;right:-230px;top:-280px}
.card{position:relative;z-index:2;width:min(400px,100%);border-radius:26px;
  padding:42px 36px 28px;text-align:center;background:rgba(252,247,239,.97);
  box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 1px rgba(253,225,175,.28)}
.lg{height:52px;width:auto;display:block;margin:0 auto}
.kick{font-size:9.5px;font-weight:800;letter-spacing:.32em;text-transform:uppercase;
  color:#aa9571;margin-top:10px}
.who{font-size:13px;font-weight:700;color:#6b6255;margin-top:12px}
.opts{margin-top:26px;display:flex;flex-direction:column;gap:12px;text-align:left}
.opt{display:flex;align-items:center;gap:14px;border-radius:17px;padding:16px 18px;
  text-decoration:none;color:#111;transition:.18s;position:relative}
.opt .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.opt .ic svg{width:23px;height:23px}
.opt b{display:block;font-size:14.5px;font-weight:800}
.opt span.sub{display:block;font-size:11px;font-weight:600;color:rgba(17,17,17,.55);margin-top:3px}
.opt .ar{margin-left:auto;font-size:15px;opacity:.55;transition:.18s}
.opt:hover .ar{transform:translateX(4px);opacity:1}
.opt.p{background:linear-gradient(135deg,#FDE1AF,#D9BF92);box-shadow:0 14px 34px rgba(190,155,90,.35)}
.opt.p .ic{background:rgba(17,17,17,.10)}
.opt.p:hover{transform:translateY(-2px);box-shadow:0 20px 44px rgba(190,155,90,.45)}
.opt.s{background:#fff;border:1.5px solid rgba(17,17,17,.12)}
.opt.s .ic{background:#F4EDDF}
.opt.s:hover{border-color:#111;transform:translateY(-2px)}
.tag{position:absolute;top:-9px;right:14px;background:#111;color:#FDE1AF;
  font-size:8.5px;font-weight:800;letter-spacing:.14em;padding:4px 9px;border-radius:99px}
.foot{margin-top:24px;font-size:9.5px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:#b6ac9a;text-align:center}
</style></head><body>
